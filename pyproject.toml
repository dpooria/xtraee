[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xtraee"
description = "CLI tool to extract data from excited state calculations with qchem output files"
version = "0.0.1"
authors = [
    { name = "P. Dabbaghi" },
    { name = "Divya" },

]
# ``PathType = str | Path`` and ``dict[str, ...]`` are evaluated at import time,
# so the package does not import on 3.8/3.9 whatever the metadata claims.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["excited state", "chemistry", "physics", "QChem", "CCSD", "CIS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "rich",
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/dpooria/xtraee"
Source = "https://github.com/dpooria/xtraee"

[project.scripts]
xtraee = "xtraee.cli:main"

[tool.setuptools.data-files]
"share/xtraee" = ["scripts/*"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.setuptools.packages.find]
include = ["xtraee*"]
